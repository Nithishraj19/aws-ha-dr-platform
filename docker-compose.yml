services:
  app:
    build:
      context: ./application
    image: aws-ha-dr-demo:local
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
